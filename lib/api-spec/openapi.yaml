openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Signed-in storefront data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront/state:
    get:
      operationId: getStorefrontState
      tags: [storefront]
      summary: Load the signed-in user's saved storefront state
      responses:
        "200":
          description: Saved cart and favorites, or empty defaults for a new account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontState"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveStorefrontState
      tags: [storefront]
      summary: Save the signed-in user's cart and favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontStateInput"
      responses:
        "200":
          description: The saved storefront state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontState"
        "400":
          description: Invalid storefront state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StorefrontCartItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        qty:
          type: integer
          minimum: 1
          maximum: 99
      required: [name, qty]
    StorefrontStateInput:
      type: object
      properties:
        cart:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StorefrontCartItem"
        favorites:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 120
      required: [cart, favorites]
    StorefrontState:
      allOf:
        - $ref: "#/components/schemas/StorefrontStateInput"
        - type: object
          properties:
            isNew:
              type: boolean
          required: [isNew]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

